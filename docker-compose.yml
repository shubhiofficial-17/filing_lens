services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: filinglens
      POSTGRES_DB: filinglens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens -d filinglens"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment:
      FILINGLENS_DATABASE_URL: postgresql://filinglens:filinglens@db:5432/filinglens
    depends_on:
      db:
        condition: service_healthy

  # The same image, serving the MCP tools over streamable HTTP at http://localhost:8001/mcp
  mcp:
    build: ./api
    command: ["python", "-m", "app.mcp.server", "--transport", "http", "--host", "0.0.0.0",
              "--port", "8001"]
    environment:
      FILINGLENS_DATABASE_URL: postgresql://filinglens:filinglens@db:5432/filinglens
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
