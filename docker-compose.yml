services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: filinglens
      POSTGRES_DB: filinglens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens -d filinglens"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      FILINGLENS_DATABASE_URL: postgresql://filinglens:filinglens@db:5432/filinglens
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
