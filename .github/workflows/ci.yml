name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filinglens
          POSTGRES_PASSWORD: filinglens
          POSTGRES_DB: filinglens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filinglens"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FILINGLENS_TEST_DATABASE_URL: postgresql://filinglens:filinglens@localhost:5432/filinglens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v
      - name: Evaluation (demo model, fixture corpus)
        run: |
          python -m app.eval.run --check --out /tmp/eval-report.json --markdown /tmp/eval.md
          cat /tmp/eval.md >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run test:ci
      - run: npx ng build --configuration production

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for the stack through nginx
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: MCP server answers over streamable HTTP
        run: |
          curl -fsS -X POST http://localhost:8001/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q FilingLens
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: docker compose logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
